services:
  jenkins-master:
    image: jenkins/jenkins:lts
    container_name: jenkins-master
    privileged: true
    ports:
      - "8080:8080"
      - "50000:50000"
    volumes:
      - jenkins_home:/var/jenkins_home
    networks:
      - jenkins-net

  jenkins-agent:
    image: jenkins/inbound-agent:latest-jdk21
    container_name: jenkins-remote-agent
    depends_on:
      - jenkins-master
    environment:
      - JENKINS_URL=http://jenkins-master:8080
      - JENKINS_SECRET=ed73e5c968cec1e75061238542d8a32edf398192924c5d4a7664b48d8295f90c
      - JENKINS_NAME=remote-linux-node
      - JENKINS_WEB_SOCKET=true
    networks:
      - jenkins-net

networks:
  jenkins-net:
    driver: bridge

volumes:
  jenkins_home: